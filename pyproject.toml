[project]
name = "ncccu"
version = "0.3.0"
description = "NCCCU Study-level ConvNeXt chest X-ray classification"
readme = "README.md"
authors = [
    { name = "yandifei", email = "3058439878@qq.com" }
]
requires-python = ">=3.15.2"
dependencies = [
    "torch>=2.15.0",
    "torchvision>=0.29.2",
    "timm>=1.0.26,<2",
    "safetensors>=0.5",
    "numpy",
    "pillow",
    "matplotlib",
    "tqdm",
]

[project.scripts]
ncccu = "ncccu:main"

[build-system]
requires = ["uv_build>=0.13.7,<0.14.0"]
build-backend = "uv_build"

[tool.uv.sources]
torch = { index = "pytorch" }
torchvision = { index = "pytorch" }

[[tool.uv.index]]
name = "pytorch"
url = "https://download.pytorch.org/whl/cu134"
